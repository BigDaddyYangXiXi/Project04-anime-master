<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全页面开发画面对照</title><style>*{box-sizing:border-box}body{margin:0;background:#171514;color:#f6eee8;font:14px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 8px}h2{font-size:17px;margin:0}p{color:#b9aaa0;margin:0 0 24px}a{color:#ff946b}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button,select{font:inherit;color:inherit;border:1px solid #443a34;background:#302a26;padding:8px 16px;border-radius:10px;min-height:44px}button.active{color:#ff946b;border-color:#ff946b}section{border-top:1px solid #443a34;padding:24px 0;margin-top:24px}.meta{display:flex;justify-content:space-between;gap:16px;color:#b9aaa0;font-size:12px}.shots{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:24px;margin:16px 0}img{display:block;width:100%;height:auto;border-radius:24px;border:1px solid #443a34}figure{margin:0}figcaption{margin-bottom:8px;color:#b9aaa0;font-size:12px}.badge{display:inline-block;margin-left:12px;color:#ff946b;font-size:12px}footer{margin-top:32px;color:#b9aaa0}@media(max-width:650px){main{padding:24px 16px}.shots{gap:12px}h1{font-size:24px}.meta{display:block}}</style><main><h1>全页面 · 开发画面对照</h1><p>延续已确认的作品详情、确认预约与预约状态设计规则。下方展示本轮微信开发者工具实际画面，使用本地测试数据。</p><div id="status">正在读取最新记录…</div><nav><button class="active" data-role="all">全部身份</button><button data-role="buyer">需求方</button><button data-role="provider">服务方</button><select id="page" aria-label="按页面筛选"><option value="all">全部页面</option></select></nav><div id="grid"></div><footer>首屏与底部截图不能替代所有中间滚动位置、弹层及真机交互验证。商户支付、结算与法律电子签章的接通情况仍以业务验收记录为准。本轮未部署。</footer></main><script>let data=[],role='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={};function render(){const selected=document.querySelector('#page').value;document.querySelector('#grid').innerHTML=data.filter(p=>(role==='all'||p.role===role)&&(selected==='all'||p.route===selected)).map(p=>`<section><div class="meta"><h2>${esc(names[p.route]||p.route)}<span class="badge">${p.role==='provider'?'服务方':'需求方'}</span></h2><span>${esc(p.capturedAt)}</span></div><div class="shots">${['top','bottom'].map((part,i)=>`<figure><figcaption>${i?'滚动到底部':'完整首屏'}</figcaption><a href="/shots/${p.id}-${part}.png" target="_blank"><img loading="lazy" src="/shots/${p.id}-${part}.png" alt="${esc(names[p.route]||p.route)}${i?'底部':'首屏'}"></a></figure>`).join('')}</div></section>`).join('')}Promise.all([fetch('/capture.json').then(r=>r.json()),fetch('/catalog.json').then(r=>r.json())]).then(([capture,catalog])=>{catalog.pages.forEach(p=>names[p.route]=p.name);data=capture.pages;document.querySelector('#status').textContent=`已采集 ${data.length} 组身份画面 · ${new Set(data.map(p=>p.route)).size} 个页面 · 记录中 ${capture.errors.length} 项采集错误`;document.querySelector('#page').innerHTML+=[...new Set(data.map(p=>p.route))].map(r=>`<option value="${r}">${esc(names[r]||r)}</option>`).join('');render()}).catch(()=>document.querySelector('#status').textContent='当前记录暂时不可读取，请稍后刷新');document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#page').onchange=render;</script></html>
